<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ShopLite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-2 align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="btn btn-outline-dark position-relative ms-2" href="cart.html">
                        <i class="bi bi-cart3"></i>Cart
                          <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
                    </a></li>
                </ul>
            </div>
        </div>
    </nav>

<main class="container my-5">
    <h1 class="h3 mb-4 fw-bold">Your Shopping Cart</h1>

    <div id="empty-cart-state" class="text-center py-5 d-none bg-white rounded shadow-sm">
      <i class="bi bi-cart-x text-muted" style="font-size: 4rem;"></i>
      <h3 class="mt-3">Your cart is empty</h3>
      <p class="text-muted">Looks like you haven't added any items to your cart yet.</p>
      <a href="index.html" class="btn btn-primary mt-2">Back to Shopping</a>
    </div>

    <div id="cart-content" class="row g-4 d-none">
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4 bg-white" id="cart-items-container">
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card border-0 shadow-sm p-4 bg-white">
          <h4 class="h5 mb-3 fw-bold">Order Summary</h4>
          <hr>
          <div class="d-flex justify-content-between mb-2">
            <span>Subtotal</span>
            <span id="subtotal-price">$0.00</span>
          </div>
          <div class="d-flex justify-content-between mb-2">
            <span>Shipping</span>
            <span class="text-success">Free</span>
          </div>
          <hr>
          <div class="d-flex justify-content-between mb-4 fw-bold fs-5">
            <span>Total</span>
            <span id="total-price" class="text-danger">$0.00</span>
          </div>
          <button class="btn btn-primary btn-lg w-100 mb-2" id="btn-checkout">Proceed to Checkout</button>
          <button class="btn btn-outline-danger btn-sm w-100" id="btn-clear-cart">Clear Cart</button>
        </div>
      </div>
    </div>
  </main>



   <!---Footer-->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-1">&copy; 2024 ShopLite. All rights reserved.</p>
            <small class="text-muted">TienPQ9</small>
        </div>
    </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/cart.js"></script>
</body>
</html>
