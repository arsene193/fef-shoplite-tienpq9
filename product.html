<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ShopLite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-2 align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Shop</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="btn btn-outline-dark position-relative ms-2" href="cart.html">
                        <i class="bi bi-cart3"></i>Cart
                          <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
                    </a></li>
                </ul>
            </div>
        </div>
    </nav>
 <main class="container my-5">
    <div id="loading-spinner" class="text-center my-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Loading product details...</p>
    </div>

    <div id="error-message" class="alert alert-danger d-none my-5" role="alert">
      This product does not exist or a network error occurred. <a href="index.html" class="alert-link">Back to shop</a>.
    </div>

    <div id="product-detail" class="row g-4 d-none">
      <div class="col-md-6">
        <div class="card p-4 text-center border-0 shadow-sm bg-white">
          <img id="detail-img" src="" class="img-fluid" style="max-height: 400px; object-fit: contain;" alt="">
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-4 border-0 shadow-sm bg-white h-100 d-flex flex-column justify-content-between">
          <div>
            <span id="detail-category" class="badge bg-secondary mb-2 text-uppercase"></span>
            <h1 id="detail-title" class="h3 fw-bold text-dark"></h1>
            <div class="d-flex align-items-center mb-3">
              <span id="detail-rating-stars" class="text-warning me-2"></span>
              <span id="detail-rating-text" class="text-muted small"></span>
            </div>
            <h3 id="detail-price" class="text-danger fw-bold my-3"></h3>
            <p id="detail-desc" class="text-muted leading-relaxed"></p>
          </div>
          <div class="mt-4 pt-4 border-top">
            <button id="btn-add-to-cart" class="btn btn-dark btn-lg w-100">
              <i class="bi bi-cart-plus me-2"></i> Add to Cart
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>



    <!---Footer-->
    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-1">&copy; 2024 ShopLite. All rights reserved.</p>
            <small class="text-muted">TienPQ9</small>

        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/product.js"></script>
</body>
</html>
